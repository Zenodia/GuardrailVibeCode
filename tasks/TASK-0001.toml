# Worked example from architecture finding F5. It cites only
# approved requirements, so lint passes once it is pinned. Paths and
# symbols come from the audit at a2dc941; the ARCHITECT must
# re-verify them against current main before setting status = "ready".

id = "TASK-0001"
title = "Fail fast when physforge default config paths are missing"
feature = "FEAT-0001"
kind = "fix"
status = "draft"
profile = "worker-32k"
package = "physforge"
depends_on = []
feature_hash = "UNSET"

goal = """`physforge-generate-physics --manifest M` with no config options
must exit non-zero *before* running any assignment subprocess, with a
message naming each missing default path and the CLI option that
supplies it. Behaviour with all four explicit options is unchanged."""

[requirements]
"REQ-CFG-003" = "UNSET"
"REQ-IFACE-002" = "UNSET"
"REQ-DEV-001" = "UNSET"

[scope]
allowed = ["packages/physforge/src/physforge/cli/generate_physics.py",
           "packages/physforge/tests/test_generate_physics_cli.py",
           "packages/physforge/README.md"]
forbidden = ["packages/physforge/src/physforge/physics/**",
             "packages/physforge/examples/**"]
may_edit_existing_tests = false
allow_new_dependencies = []
allow_interface_change = []
allow_new_import_edges = []
max_files_changed = 3
max_lines_changed = 150

[acceptance]
tests = [
  "packages/physforge/tests/test_generate_physics_cli.py::test_missing_default_config_fails_fast",
  "packages/physforge/tests/test_generate_physics_cli.py::test_explicit_paths_unchanged_output",
]
criteria = [
  "Exit code != 0 and no assign_* subprocess started when a default path is absent",
  "stderr contains the missing path and the option name (e.g. --material)",
  "With explicit example configs, the enriched manifest is byte-identical to the output before the change",
]

[validate]
commands = [
  "uv run pytest packages/physforge/tests -q",
  "uv run ruff check packages/physforge",
]
timeout_seconds = 300

[context]
excerpts = [
  { path = "packages/physforge/src/physforge/cli/generate_physics.py", symbol = "main" },
  { path = "packages/physforge/src/physforge/cli/generate_physics.py", lines = "1-60" },
]
read_on_demand = ["packages/physforge/README.md",
                  "packages/physforge/examples/"]
notes = """CONFIG_DIR is derived near line 17 and points at
src/physforge/configs, which is absent. The pipeline runs three
`python -m physforge.physics.assign_*` subprocesses with check=True
(near line 45). Test the fail-fast path by asserting that subprocess.run
is not called (monkeypatch) and the exit code is non-zero. The second
test must run the real three steps on packages/physforge/examples/ in a
tmp_path copy. Mark both tests @pytest.mark.req("REQ-CFG-003")."""

[escalate]
when = [
  "Making defaults work requires creating src/physforge/configs or moving examples (out of scope: canonical config)",
  "The explicit-path output differs from the pre-change output for any reason",
  "Monkeypatching subprocess is impossible without refactoring physics/ modules",
]

[commit]
allowed = false
