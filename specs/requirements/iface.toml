[[requirement]]
id = "REQ-IFACE-001"
version = 1
status = "approved"
level = "MUST"
principle = ["CON-07"]
text = """Public APIs listed in specs/interfaces.toml and registered CLI
commands and flags must keep their signatures and behaviour unless an
approved task authorizes the change and updates docs in the same change."""
verify = "script:check_interfaces"
source = "AGENTS.md#Safety and Validation (public APIs)"

[[requirement]]
id = "REQ-IFACE-002"
version = 1
status = "approved"
level = "MUST"
principle = ["CON-07"]
text = """When behaviour or an interface changes, the package README and
docs/architecture entries that describe it must be updated in the same
change."""
verify = "review"
source = "AGENTS.md#Development"

