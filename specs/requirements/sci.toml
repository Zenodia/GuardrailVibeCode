[[requirement]]
id = "REQ-SCI-001"
version = 1
status = "approved"
level = "MUST"
principle = ["CON-02"]
text = """Reports must distinguish software test success from physical or
numerical validation, and must not claim validation without evidence
(a named qualification case, reference comparison, or measurement)."""
verify = "review"
source = "AGENTS.md#Safety and Validation"

[[requirement]]
id = "REQ-SCI-002"
version = 1
status = "approved"
level = "MUST"
principle = ["CON-01"]
text = """Changes to a numerical method (integrator, time stepping,
interpolation, sampling, solver settings, mesh policy) require a task
that cites this requirement and names a reference comparison test with
an explicit tolerance."""
verify = "review"
source = "AGENTS.md#Architecture (validated numerical methods)"

[[requirement]]
id = "REQ-SCI-003"
version = 1
status = "approved"
level = "MUST"
principle = ["CON-10"]
text = """Reference simulation data, packaged data tables and generated
published results must not be modified, regenerated or deleted without
explicit human approval recorded in the task."""
verify = "script:check_scope"
source = "AGENTS.md#Safety and Validation"

[[requirement]]
id = "REQ-SCI-004"
version = 1
status = "approved"
level = "MUST"
principle = ["CON-08", "CON-01"]
text = """Numerical tolerances in existing tests (atol, rtol, approx,
thresholds) must not be loosened without an approved task citing the
physical justification."""
verify = "script:check_scope"
source = "governance/RECOVERY.md#R5"
