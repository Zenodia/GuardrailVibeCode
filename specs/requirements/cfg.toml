[[requirement]]
id = "REQ-CFG-001"
version = 1
status = "approved"
level = "MUST"
principle = ["CON-03"]
text = """Configuration files are the authoritative source of runtime
parameters and settings. A package must not keep an independent copy of
a parameter that a canonical config defines."""
verify = "review"
source = "kit baseline"

[[requirement]]
id = "REQ-CFG-002"
version = 1
status = "approved"
level = "MUST"
principle = ["CON-03", "CON-04"]
text = """Runtime overrides (CLI flags, environment variables) of
configuration values must be explicit and must be recorded wherever the
run or release records its effective configuration."""
verify = "test"
source = "kit baseline"

[[requirement]]
id = "REQ-CFG-003"
version = 1
status = "approved"
level = "MUST"
principle = ["CON-03"]
text = """New or changed configuration schemas must be explicit and
validated at load time. A loader must reject a missing or malformed
required section with an error naming the file and the key."""
verify = "test"
source = "kit baseline"

[[requirement]]
id = "REQ-CFG-004"
version = 1
status = "approved"
level = "MUST"
principle = ["CON-01", "CON-03"]
text = """Default values that affect observable output or behaviour must
not change unless the task explicitly authorizes the new value and cites
this requirement."""
verify = "review"
source = "kit baseline"

[[requirement]]
id = "REQ-CFG-005"
version = 1
status = "approved"
level = "MUST"
principle = ["CON-03", "CON-10"]
text = """Files matching protected.canonical_config in
specs/boundaries.toml must not be modified without explicit
authorization in the task."""
verify = "script:check_scope"
source = "kit baseline"
