[[requirement]]
id = "REQ-ARCH-001"
version = 1
status = "approved"
level = "MUST"
principle = ["CON-06"]
text = """Package imports must follow specs/boundaries.toml. A new import
edge between workspace packages, or any import cycle, is forbidden unless
an approved task explicitly adds the edge to boundaries.toml first."""
verify = "script:check_boundaries"
source = "kit baseline"

[[requirement]]
id = "REQ-ARCH-002"
version = 1
status = "approved"
level = "MUST"
principle = ["CON-05", "CON-06"]
text = """Where two packages are coupled through a file or data artifact,
the consumer must not import the producer to read it. The artifact
contract in specs/boundaries.toml is the interface."""
verify = "script:check_boundaries"
source = "kit baseline"

[[requirement]]
id = "REQ-ARCH-003"
version = 1
status = "approved"
level = "MUST"
principle = ["CON-06"]
text = """Production code must not import from explore/."""
verify = "script:check_boundaries"
source = "kit baseline (governance/LAYERS.md section 5)"

[[requirement]]
id = "REQ-ARCH-004"
version = 1
status = "approved"
level = "PREFER"
principle = ["CON-06"]
text = """Prefer established libraries and validated methods over custom
implementations, and avoid abstractions that have only one
implementation and no planned second."""
verify = "review"
source = "kit baseline"
