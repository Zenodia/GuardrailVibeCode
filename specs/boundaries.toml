# Dependency law. Read by check_boundaries.py, compile_packet.py,
# check_scope.py, guard_edit.py and lint_contracts.py.
#
# TEMPLATE: the bootstrap skill fills [packages.*] and [[artifact]] from
# the real repository, and `check_boundaries.py --report` verifies the
# result against actual imports. The observed graph is frozen as law;
# adding an edge afterwards needs an ADR and an approved task
# (REQ-ARCH-001).
#
# allowed_imports lists the workspace packages whose modules a package may
# import. third_party lists top-level *import names* (not distribution
# names) matching the package manifest. The standard library is always
# allowed. Anything else fails check_boundaries (REQ-DEV-002).

schema_version = 1
forbidden_import_roots = ["explore"]   # REQ-ARCH-003

# One table per package. Copy the block for each package.
[packages.example_pkg]
path = "src/example_pkg"     # FILL: directory holding the importable code
owner = "CHANGE-ME"
allowed_imports = []         # FILL: workspace packages it may import
cli_only = []                # packages it may only call as a subprocess
third_party = []             # FILL: declared third-party import names

# ---------------------------------------------------------------------
# Artifact contracts (REQ-ARCH-002, REQ-DATA-001, REQ-DATA-002).
# `keys` are the names a consumer depends on. Renaming any of them is an
# interface change that must update every consumer in the same task.
# `status`: frozen = binding now; observed = current behaviour, schema not
# yet versioned. Delete this example and add one block per artifact.

[[artifact]]
id = "ART-EXAMPLE"
name = "example_output.json"
producer = "example_pkg"
consumers = []
format = "JSON"
keys = ["schema_version"]
status = "observed"
evidence = "FILL: path:line of the writer and of each reader"

# ---------------------------------------------------------------------
# Protected paths: check_scope.py rejects any worker diff touching these,
# whatever the task scope says. guard_edit.py blocks them at edit time in
# Claude Code. Humans change them via CHANGE_CONTROL.md.
[protected]
always = ["AGENTS.md", "**/AGENTS.md", "**/AGENTS.override.md",
          "CLAUDE.md", "**/CLAUDE.md",
          "governance/**", "specs/**", "tasks/**", ".agents/**",
          ".codex/**", ".claude/**", "ci/**", ".githooks/**",
          "tools/governance/**", "schemas/**", "status/**"]
# FILL: package manifests and lockfiles (edited only via a task that
# sets allow_new_dependencies).
manifests = ["pyproject.toml", "**/pyproject.toml", "uv.lock"]
# FILL: golden files, fixtures and datasets that are reference evidence.
reference_data = ["**/reference/**"]
# FILL: configuration files that define canonical behaviour.
canonical_config = []
